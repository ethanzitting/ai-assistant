services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - internal
    # The LAN's resolver. Set explicitly because the host resolves over loopback, and Docker
    # refuses to hand a container a loopback nameserver — it would silently fall back to a public
    # resolver instead, bypassing the host's own DNS policy.
    dns: [192.168.10.1]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081 2>&1 | grep -q ''"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    dns: [192.168.10.1]
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
      B2_BUCKET_ID: ${B2_BUCKET_ID}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ACCESS_TOKEN: ${PLAID_ACCESS_TOKEN}
      PLAID_ENV: ${PLAID_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    networks:
      - internal
    dns: [192.168.10.1]
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped

# Both pins below are load-bearing on the deployment host and harmless anywhere else. Read
# "Sharing the host" in docs/infrastructure.md before changing either.
#
# The bridge NAME is pinned because the host's own firewall grants the containers internet access
# by interface name. Docker would otherwise call it br-<hash> and rename it whenever the network is
# recreated, which strips the containers of internet access with no error message anywhere —
# Jarvis just stops answering.
#
# The SUBNET is pinned so the containers are a stable, recognisable identity to the host's DNS and
# firewall rather than a new unexplained one after every recreate.
networks:
  internal:
    driver_opts:
      com.docker.network.bridge.name: jarvis0
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  pgdata:
  telegram-bot-api-data:
